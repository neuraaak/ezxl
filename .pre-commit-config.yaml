# ///////////////////////////////////////////////////////////////
# PRE-COMMIT CONFIGURATION
# ///////////////////////////////////////////////////////////////
# Mirrors the quality checks in .scripts/dev/lint.py (in order):
#   1. ruff format     — auto-format code
#   2. ruff check      — lint with auto-fix
#   3. ty check        — type checking
#   4. lint-imports    — layer dependency contracts
#   5. update_version  — sync _version.py ← pyproject.toml
#
# Setup (run once per clone):
#   uv sync
#   uv run pre-commit install
#
# Run manually on all files:
#   uv run pre-commit run --all-files
#
# Notes:
#   - All hooks use language: system and run inside the project venv
#     via uv run --no-sync. No network access required after uv sync.
#   - ruff config is read from pyproject.toml [tool.ruff].
#   - When ruff or sync-version modifies files, pre-commit aborts the
#     commit; stage the changes (git add -u) and recommit.

repos:
  - repo: local
    hooks:
      # ///////////////////////////////////////////////////////////////
      # FILE HYGIENE
      # ///////////////////////////////////////////////////////////////
      - id: check-merge-conflict
        name: "Check — merge conflict markers"
        language: system
        entry: uv run --no-sync python .scripts/dev/check_merge_conflict.py
        types: [text]

      - id: check-yaml
        name: "Check — YAML syntax"
        language: system
        entry: uv run --no-sync python .scripts/dev/check_yaml.py
        types: [yaml]

      - id: check-toml
        name: "Check — TOML syntax"
        language: system
        entry: uv run --no-sync python .scripts/dev/check_toml.py
        types: [toml]

      # ///////////////////////////////////////////////////////////////
      # RUFF — format then lint  (steps 1 & 2)
      # Config is read from pyproject.toml [tool.ruff]
      # ///////////////////////////////////////////////////////////////

      # Step 1 — format
      - id: ruff-format
        name: "Ruff Format"
        language: system
        entry: uv run --no-sync ruff format
        types: [python]

      # Step 2 — lint with auto-fix
      # --exit-non-zero-on-fix: abort commit so dev can review & re-stage
      - id: ruff-check
        name: "Ruff Check"
        language: system
        entry: uv run --no-sync ruff check --fix --exit-non-zero-on-fix
        types: [python]

      # ///////////////////////////////////////////////////////////////
      # LOCAL HOOKS — ty, import-linter, version sync  (steps 3–5)
      # ///////////////////////////////////////////////////////////////

      # Step 3 — type check
      - id: ty
        name: "Ty — type check"
        language: system
        entry: uv run --no-sync ty check --output-format=concise
        types: [python]
        pass_filenames: false

      # Step 4 — layer dependency contracts
      # Relies on editable install so that ezxl is importable
      # without an explicit PYTHONPATH override.
      - id: import-linter
        name: "Import Linter — layer contracts"
        language: system
        entry: uv run --no-sync lint-imports
        pass_filenames: false
        always_run: true

      # Step 5 — keep _version.py in sync with pyproject.toml
      # Only triggered when pyproject.toml is staged.
      - id: sync-version
        name: "Sync _version.py ← pyproject.toml"
        language: system
        entry: uv run --no-sync python .scripts/dev/update_version.py
        files: ^pyproject\.toml$
        pass_filenames: false
