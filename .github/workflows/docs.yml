name: Deploy Documentation

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

concurrency:
  group: deploy-docs
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy Docs
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      - run: uv sync --frozen --extra docs --extra test

      - name: Generate coverage report
        # excel marker requires a live Excel installation (Windows only) — excluded from CI
        run: uv run pytest -m "not excel" --cov=src/ezxl --cov-report=html --cov-report=xml -q

      - name: Enforce import contracts
        run: PYTHONPATH=src uv run lint-imports

      - name: Generate architecture graph
        run: |
          if [ -f ".scripts/dev/generate_architecture_graph.py" ]; then
            uv run python .scripts/dev/generate_architecture_graph.py
          fi

      - name: Generate changelog
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4
        with:
          config: cliff.toml
          args: --output docs/changelog.md

      - name: Configure git for mike
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages --depth=1 || true

      - name: Deploy documentation with mike
        run: |
          VERSION=$(grep -E '^version\s*=\s*"' pyproject.toml | head -1 | sed 's/.*version\s*=\s*"\([^"]*\)".*/\1/')
          uv run mike deploy --push --update-aliases "$VERSION" latest
          uv run mike set-default --push latest
