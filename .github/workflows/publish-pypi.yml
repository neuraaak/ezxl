name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip tests before publishing (not recommended)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      tag:
        required: true
        type: string

permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  PACKAGE_NAME: ezxl

jobs:
  validate:
    name: Validate & Build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version || '' }}
        run: |
          VERSION="$INPUT_VERSION"
          if [ -z "$VERSION" ]; then
            VERSION=$(grep -E '^version\s*=\s*"' pyproject.toml | head -1 | sed 's/.*version\s*=\s*"\([^"]*\)".*/\1/')
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Preview mode summary
        if: github.event_name == 'push' || github.event_name == 'pull_request' || (github.event_name == 'workflow_call' && startsWith(inputs.tag, 'preview-'))
        run: |
          echo "## 🔎 Publish Preview Mode" >> $GITHUB_STEP_SUMMARY
          echo "- Event: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Branch/PR validation runs fully." >> $GITHUB_STEP_SUMMARY
          echo "- Final PyPI publish step is intentionally skipped." >> $GITHUB_STEP_SUMMARY

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      - run: uv sync --frozen --extra dev

      - name: Enforce import contracts
        run: PYTHONPATH=src uv run --frozen lint-imports

      - name: Run tests
        # excel marker requires a live Excel installation (Windows only) — excluded from CI
        if: github.event.inputs.skip_tests != 'true'
        run: uv run --frozen pytest -m "not excel"

      - name: Build package
        run: uv build

      - name: Check package
        run: uv run --frozen twine check dist/*

      - name: Verify wheel installation
        run: |
          python -m zipfile -t dist/*.whl
          python - <<'PY'
          import glob
          import sys
          import zipfile

          wheels = glob.glob("dist/*.whl")
          if not wheels:
            raise SystemExit("No wheel found in dist/")

          with zipfile.ZipFile(wheels[0]) as zf:
            names = zf.namelist()

          if not any(name.startswith("ezxl/") for name in names):
            raise SystemExit("Wheel does not contain ezxl package")

          print("Wheel integrity check passed")
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 1

  publish:
    name: Publish to PyPI (OIDC)
    needs: validate
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_call' && !startsWith(inputs.tag, 'preview-'))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/${{ env.PACKAGE_NAME }}/${{ needs.validate.outputs.version }}/

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@v1.14.0
        with:
          verbose: true
          # Attestations disabled: when called as a reusable workflow from
          # auto-tag.yml, the OIDC token's Build Config URI reflects the
          # caller (auto-tag.yml) rather than this workflow, causing PyPI
          # Trusted Publisher verification to fail.
          attestations: false

      - name: Summary
        run: |
          echo "## 📦 Published to PyPI" >> $GITHUB_STEP_SUMMARY
          echo "- **Package**: ${{ env.PACKAGE_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ needs.validate.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: https://pypi.org/project/${{ env.PACKAGE_NAME }}/${{ needs.validate.outputs.version }}/" >> $GITHUB_STEP_SUMMARY
