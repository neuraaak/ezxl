name: 01 · CI

# Quality gate: lint/format and type-check/import-contracts run first and block
# the test matrix, which runs on Ubuntu and Windows. Security runs alongside
# them: it gates the workflow, not the matrix. Runs on PRs, and as the release
# gate via workflow_call from 02-tag-sync (no bare `push` trigger → one CI run
# per change, no double runs).

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/00-install-deps.yml"
      - ".github/workflows/01-ci.yml"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  install-deps:
    uses: ./.github/workflows/00-install-deps.yml

  lint:
    name: Lint & Format Check
    needs: [install-deps]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
      # python-version is pinned on every setup-uv step: left to itself, uv
      # resolves the newest interpreter satisfying requires-python (>=3.13) and
      # the runners now offer 3.15, for which native dependencies such as grimp
      # have no wheel — the source build then fails in PyO3.
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --frozen --group dev
      - run: uv run --frozen poe lint
      - run: uv run --frozen poe format-check

  type-check:
    name: Type Check & Import Contracts
    needs: [install-deps]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --frozen --group dev
      # pyright targets pythonPlatform = "Windows" so win32com/ctypes.windll
      # resolve on the Ubuntu runner; ty ignores unresolved Windows-only imports.
      - run: uv run --frozen poe typecheck
      # The poe task carries PYTHONPATH=src itself (import-linter 2.x needs
      # the package importable).
      - run: uv run --frozen poe imports

  security:
    name: Security (bandit + pip-audit)
    needs: [install-deps]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --frozen --group dev
      - run: uv run --frozen poe security

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: [lint, type-check]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Windows is the product's target OS (AGENTS.md): pywin32 and pywinauto
        # only install there, so the platform guard and the COM-adjacent import
        # surface are exercised nowhere else. Ubuntu stays the reference matrix
        # for coverage, and proves the cross-platform modules stay importable.
        os: [ubuntu-24.04, windows-latest]
        python: ["3.13"]
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --frozen --group dev
      # `poe test-ci` deselects the `excel` marker (live Excel over COM: no
      # runner has an Excel installation) and carries the coverage threshold,
      # which is deliberately not in addopts: a partial local run must not
      # exit with code 1.
      - run: uv run --frozen poe test-ci
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.os == 'ubuntu-24.04' && matrix.python == '3.13' && always()
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
          retention-days: 7
