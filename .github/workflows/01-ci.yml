name: 01 · CI

# Quality gate: quality/type-check run first and block the test matrix, which
# runs on Ubuntu and Windows; security runs in parallel and deliberately gates
# nothing (it reads an external advisory feed, so it can turn red without the
# code changing). Runs on PRs, and as the release gate via workflow_call from
# 02-tag-sync (no bare `push` trigger → one CI run per change, no double runs).
#
# No `paths:` filter: a filtered trigger left changes to .scripts/, cliff.toml
# and the release workflows themselves (02/03/04) validated by nothing at all.

on:
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Four consumers (quality, type-check, security, test): all four install,
  # so the primer is above the ~3-consumer heuristic on its own merits.
  install-deps:
    name: Install & cache deps
    uses: ./.github/workflows/00-install-deps.yml

  quality:
    name: Lint & format
    needs: [install-deps]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # python-version is pinned on every setup-uv step: left to itself, uv
      # resolves the newest interpreter satisfying requires-python (>=3.13) and
      # the runners now offer 3.15, for which native dependencies such as grimp
      # have no wheel — the source build then fails in PyO3.
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --frozen --group dev
      - run: uv run --frozen poe lint
      - run: uv run --frozen poe format-check

  type-check:
    name: Type check & contracts
    needs: [install-deps]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --frozen --group dev
      # pyright targets pythonPlatform = "Windows" so win32com/ctypes.windll
      # resolve on the Ubuntu runner; ty ignores unresolved Windows-only imports.
      - run: uv run --frozen poe typecheck
      # The poe task carries PYTHONPATH=src itself (import-linter 2.x needs
      # the package importable).
      - run: uv run --frozen poe imports

  security:
    name: Security scan
    needs: [install-deps]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --frozen --group dev
      - run: uv run --frozen poe security

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: [quality, type-check]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Windows is the product's target OS (AGENTS.md): pywin32 and pywinauto
        # only install there, so the platform guard and the COM-adjacent import
        # surface are exercised nowhere else. That also makes Windows the only
        # runner where the coverage total is meaningful, so it carries the gate.
        # Ubuntu proves the cross-platform modules stay importable.
        os: [ubuntu-24.04, windows-latest]
        python: ["3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --frozen --group dev
      # Both tasks deselect the `excel` marker (live Excel over COM: no runner
      # has an Excel installation). Only the Windows leg enforces the 85%
      # threshold: on Linux the win32-only modules never import, so the total
      # lands around 80% however well the testable code is covered.
      - run: uv run --frozen poe test-ci
        if: runner.os == 'Windows'
      - run: uv run --frozen poe test-ci-nogate
        if: runner.os != 'Windows'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.os == 'ubuntu-24.04' && matrix.python == '3.13' && always()
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
          retention-days: 7
