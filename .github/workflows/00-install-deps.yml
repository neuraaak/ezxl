name: 00 · Install Deps

# Logic-free cache primer: warms the uv download cache (keyed on uv.lock by
# setup-uv) so every downstream job that repeats `uv sync` gets a cache hit
# instead of a network resolve. Called via workflow_call by 01-ci and others.

on:
  workflow_call:
    inputs:
      python-version:
        required: false
        type: string
        default: "3.13"

permissions: {}

jobs:
  install:
    name: Prime uv cache
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ inputs.python-version }}
          enable-cache: true
      - run: uv sync --frozen --all-groups
