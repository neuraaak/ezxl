name: 03 · Publish

# Build + package on every mode; upload to PyPI only when `tag_action` is
# `create` (a real release). Gating is keyed on the `tag_action` INPUT, never on
# github.event_name: in a reusable workflow the event is inherited from the
# caller (`push`), so an `event_name == 'workflow_call'` check never matches —
# and an `event_name == 'workflow_dispatch'` escape hatch would let a manual run
# from an arbitrary ref fire the irreversible PyPI upload. A manual dispatch
# therefore defaults to `preview` and must opt in explicitly.

on:
  workflow_dispatch:
    inputs:
      tag_action:
        description: "create = publish to PyPI (irreversible) | preview = build only"
        required: true
        type: choice
        default: preview
        options:
          - preview
          - create
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      tag_action:
        required: false
        type: string
        default: create # create | preview

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

env:
  PACKAGE_NAME: ezxl

jobs:
  validate:
    name: Validate & build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pinned for the same reason as in 01-ci: uv would otherwise pick the
      # newest interpreter satisfying requires-python and build grimp from
      # source on 3.15.
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.13"
          enable-cache: true

      - run: uv sync --frozen --group dev

      # The caller's input must agree with pyproject.toml, or the artifact would
      # be published under a number that is not the one the tag points at.
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version || '' }}
        run: |
          FILE_VERSION=$(uv run --frozen poe -q read-version)
          VERSION="${INPUT_VERSION:-$FILE_VERSION}"
          if [ -z "$VERSION" ]; then
            echo "::error::No version found in pyproject.toml"
            exit 1
          fi
          if [ "$VERSION" != "$FILE_VERSION" ]; then
            echo "::error::Version mismatch: input $VERSION vs pyproject.toml $FILE_VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Enforce import contracts
        run: uv run --frozen poe imports

      - name: Build package
        run: uv run --frozen poe build

      - name: Verify package metadata
        run: uv run --frozen twine check dist/*

      - name: Verify package contents
        run: |
          python -m zipfile -t dist/*.whl
          python - <<'PY'
          import glob
          import sys
          import zipfile

          wheels = glob.glob("dist/*.whl")
          if not wheels:
            raise SystemExit("No wheel found in dist/")

          with zipfile.ZipFile(wheels[0]) as zf:
            names = zf.namelist()

          if not any(name.startswith("ezxl/") for name in names):
            raise SystemExit("Wheel does not contain ezxl package")

          print("Wheel integrity check passed")
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 1

  publish:
    name: Publish (PyPI)
    needs: validate
    if: inputs.tag_action == 'create'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/${{ env.PACKAGE_NAME }}/${{ needs.validate.outputs.version }}/

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish (OIDC)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          verbose: true
          # Replay-safe: 02-tag-sync creates the tag before this job runs, so a
          # release whose upload failed is recovered by dispatching 03 again.
          # Without this, the replay would 409 on the already-present version.
          skip-existing: true
          # Attestations disabled: when called as a reusable workflow from
          # 02-tag-sync.yml, the OIDC token's Build Config URI reflects the
          # caller rather than this workflow, causing PyPI Trusted Publisher
          # verification to fail.
          attestations: false

      - name: Summary
        run: |
          echo "## 📦 Published to PyPI" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Package**: ${{ env.PACKAGE_NAME }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Version**: ${{ needs.validate.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **URL**: https://pypi.org/project/${{ env.PACKAGE_NAME }}/${{ needs.validate.outputs.version }}/" >> "$GITHUB_STEP_SUMMARY"
